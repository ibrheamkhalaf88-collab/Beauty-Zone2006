app = "beauty-zone2006"
primary_region = "ams"

[build]

[env]
  PORT = "3001"
  JWT_SECRET = "bz-fly-secret-2026-production"
  ALLOWED_ORIGIN = "*"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
