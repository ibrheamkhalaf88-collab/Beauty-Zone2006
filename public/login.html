<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beauty Zone — تسجيل الدخول</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Beauty Zone">
  <link rel="apple-touch-icon" href="assets/bz_icon_192.png">
  <link rel="manifest" href="pwa-manifest.json" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Tajawal:wght@300;400;500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" async></script>

  <style>
    /* ══════════════════════════════════════════
       LOGIN PAGE — Full Screen Professional
       ══════════════════════════════════════════ */
    :root {
      --rose: #C2856B;
      --plum: #8B3A3A;
      --champagne: #F0E6D3;
      --gold: #C4A35A;
      --warm-bg: #F5EDE3;
      --text-dark: #2C1810;
      --text-mid: #6B4C3B;
      --text-light: #9C7A6A;
      --btn-color: #8B3A3A;
      --btn-shadow: #5C1A1A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated Background ── */
    .login-bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1a0a1e 0%, #2A1020 25%, #4a1a3a 50%, #6B2D4E 75%, #2A1020 100%);
      z-index: 0;
    }

    .login-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 600px at 20% 30%, rgba(196, 163, 90, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 500px 500px at 80% 70%, rgba(194, 133, 107, 0.1) 0%, transparent 70%),
        radial-gradient(ellipse 400px 400px at 50% 50%, rgba(139, 58, 58, 0.08) 0%, transparent 70%);
    }

    .login-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 15% 85%, rgba(196,163,90,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 15%, rgba(196,163,90,0.3) 0%, transparent 100%);
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 300px; height: 300px; background: var(--gold); top: 10%; left: 15%; animation-delay: 0s; }
    .orb-2 { width: 250px; height: 250px; background: var(--rose); bottom: 15%; right: 10%; animation-delay: -3s; }
    .orb-3 { width: 200px; height: 200px; background: #9b4077; top: 60%; left: 60%; animation-delay: -5s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* ── Login Card ── */
    .login-card {
      position: relative;
      z-index: 10;
      width: 92%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 48px 36px 40px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logo ── */
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, var(--gold), var(--rose));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 8px 24px rgba(196, 163, 90, 0.3);
    }

    .login-logo-brand {
      font-family: 'Playfair Display', 'Tajawal', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .login-logo-sub {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 300;
    }

    /* ── Tabs ── */
    .login-tabs {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .login-tab {
      flex: 1;
      padding: 11px 8px;
      border-radius: 11px;
      font-size: 0.92rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Tajawal', sans-serif;
    }

    .login-tab.active {
      background: linear-gradient(135deg, var(--btn-color), #9b4077);
      color: #fff;
      box-shadow: 0 4px 16px rgba(139, 58, 58, 0.4);
    }

    .login-tab:not(.active):hover {
      color: rgba(255, 255, 255, 0.7);
    }

    /* ── Forms ── */
    .login-form { display: none; }
    .login-form.active { display: block; animation: fadeUp 0.4s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;
      padding-right: 4px;
    }

    .form-input-wrap {
      position: relative;
    }

    .form-input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0.5;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 13px 44px 13px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      direction: rtl;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .form-input:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(196, 163, 90, 0.15);
    }

    .form-input:focus ~ .form-input-icon {
      opacity: 0.9;
    }

    /* ── Divider ── */
    .form-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.8rem;
    }

    .form-divider::before,
    .form-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* ── Submit Button ── */
    .login-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--btn-color), #9b4077);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(139, 58, 58, 0.4);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .login-submit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    .login-submit:hover::before {
      transform: translateX(100%);
    }

    .login-submit:hover {
      box-shadow: 0 6px 28px rgba(139, 58, 58, 0.5);
      transform: translateY(-1px);
    }

    .login-submit:active {
      transform: translateY(0);
    }

    .login-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Switch Link ── */
    .login-switch {
      text-align: center;
      margin-top: 20px;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.45);
    }

    .login-switch a {
      color: var(--gold);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s;
    }

    .login-switch a:hover {
      color: #d4b36a;
      text-decoration: underline;
    }

    /* ── Back to Store ── */
    .login-back {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-family: 'Tajawal', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    .login-back:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .login-back svg {
      width: 18px;
      height: 18px;
    }

    /* ── Error Message ── */
    .form-error {
      display: none;
      background: rgba(220, 53, 69, 0.15);
      border: 1px solid rgba(220, 53, 69, 0.3);
      color: #ff6b7a;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      text-align: center;
      animation: shake 0.4s ease;
    }

    .form-error.show { display: block; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* ── Success Message ── */
    .form-success {
      display: none;
      background: rgba(40, 167, 69, 0.15);
      border: 1px solid rgba(40, 167, 69, 0.3);
      color: #6fcf7c;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      text-align: center;
    }

    .form-success.show { display: block; }

    /* ── Loading Spinner ── */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    .lz-toast {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 99999;
      background: rgba(30, 15, 35, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 14px 22px;
      border-radius: 14px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lz-toast.show { transform: translateX(0); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card {
        padding: 36px 24px 32px;
        border-radius: 22px;
      }

      .login-logo-brand { font-size: 1.5rem; }
      .login-logo-icon { width: 60px; height: 60px; font-size: 1.6rem; }
      .login-back { top: 16px; left: 16px; padding: 8px 14px; font-size: 0.82rem; }
    }

    /* ── Password Toggle ── */
    .pass-toggle {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pass-toggle:hover { color: rgba(255,255,255,0.7); }

    .pass-toggle svg { width: 20px; height: 20px; }

    .form-input.has-toggle { padding-left: 44px; }

    /* ── Remember Me ── */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.55);
      transition: color 0.2s;
    }

    .remember-me:hover { color: rgba(255,255,255,0.8); }

    .remember-me input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--gold);
      border-radius: 4px;
      cursor: pointer;
    }

    .forgot-link {
      font-size: 0.82rem;
      color: var(--gold);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      font-weight: 600;
      transition: color 0.2s;
      padding: 0;
    }

    .forgot-link:hover { color: #d4b36a; text-decoration: underline; }

    /* ── Forgot Password Modal ── */
    .forgot-overlay {
      position: fixed; inset: 0; z-index: 99999;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .forgot-overlay.open { opacity: 1; pointer-events: auto; }

    .forgot-card {
      background: rgba(30,15,35,0.97);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 36px 32px 32px;
      width: 92%; max-width: 420px;
      box-shadow: 0 16px 60px rgba(0,0,0,0.5);
      transform: scale(0.92) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    }

    .forgot-overlay.open .forgot-card { transform: scale(1) translateY(0); }

    .forgot-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; color: #fff; margin-bottom: 6px;
    }

    .forgot-card p {
      color: rgba(255,255,255,0.5);
      font-size: 0.88rem; margin-bottom: 20px;
    }

    .forgot-close {
      position: absolute; top: 16px; left: 16px;
      background: none; border: none; color: rgba(255,255,255,0.4);
      cursor: pointer; padding: 6px; transition: color 0.2s;
    }

    .forgot-close:hover { color: #fff; }
    .forgot-close svg { width: 22px; height: 22px; }

    .forgot-card .login-submit { margin-top: 4px; }
  </style>
</head>
<body>

  <!-- PROFILE BAR (shown when logged in) -->
  <div id="profile-bar" style="display:none;background:linear-gradient(135deg,#7B2D8B,#3d1050);color:#fff;text-align:center;padding:8px 16px;font-size:.88rem;font-weight:500;position:relative;z-index:100">
    <span>مرحباً <strong id="logged-user-name"></strong></span>
    <span style="margin:0 14px">|</span>
    <a href="account.html" style="color:var(--gold);font-weight:700;text-decoration:none">حسابي</a>
    <span style="margin:0 8px">|</span>
    <button id="btn-logout" style="background:none;border:none;color:#ffb3b3;cursor:pointer;font-family:inherit;font-size:.85rem;text-decoration:underline">تسجيل الخروج</button>
  </div>

  <!-- Background -->
  <div class="login-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Back to Store -->
  <a href="index.html" class="login-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    العودة للمتجر
  </a>

  <!-- Login Card -->
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">🌸</div>
      <p class="login-logo-brand">Beauty Zone</p>
      <p class="login-logo-sub">بيوتي زون — جمالك، بلمسة فرق</p>
    </div>

    <!-- Tabs -->
    <div class="login-tabs">
      <button class="login-tab active" data-form="login">تسجيل الدخول</button>
      <button class="login-tab" data-form="register">حساب جديد</button>
    </div>

    <!-- Error / Success Messages -->
    <div class="form-error" id="form-error"></div>
    <div class="form-success" id="form-success"></div>

    <!-- ═══ LOGIN FORM ═══ -->
    <form class="login-form active" id="form-login" autocomplete="on">
      <div class="form-group">
        <label class="form-label">رقم الهاتف أو البريد الإلكتروني</label>
        <div class="form-input-wrap">
          <input type="text" class="form-input" id="login-id" placeholder="05XXXXXXXX أو email" autocomplete="username" required />
          <span class="form-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <div class="form-input-wrap">
          <input type="password" class="form-input has-toggle" id="login-pass" placeholder="أدخل كلمة المرور" autocomplete="current-password" required />
          <span class="form-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <button type="button" class="pass-toggle" onclick="togglePass('login-pass', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember-me" />
          تذكريني
        </label>
        <button type="button" class="forgot-link" onclick="openForgot()">نسيت كلمة المرور؟</button>
      </div>

      <button type="submit" class="login-submit" id="btn-login">تسجيل الدخول</button>
    </form>

    <!-- ═══ REGISTER FORM ═══ -->
    <form class="login-form" id="form-register" autocomplete="on">
      <div class="form-group">
        <label class="form-label">الاسم الكامل</label>
        <div class="form-input-wrap">
          <input type="text" class="form-input" id="reg-name" placeholder="الاسم كما يظهر في الحساب" autocomplete="name" required />
          <span class="form-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">رقم الهاتف</label>
        <div class="form-input-wrap">
          <input type="tel" class="form-input" id="reg-phone" placeholder="05XXXXXXXX" autocomplete="tel" required />
          <span class="form-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">البريد الإلكتروني <span style="opacity:0.4">(اختياري)</span></label>
        <div class="form-input-wrap">
          <input type="email" class="form-input" id="reg-email" placeholder="email@example.com" autocomplete="email" />
          <span class="form-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <div class="form-input-wrap">
          <input type="password" class="form-input has-toggle" id="reg-pass" placeholder="6 أحرف على الأقل" autocomplete="new-password" required minlength="6" />
          <span class="form-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <button type="button" class="pass-toggle" onclick="togglePass('reg-pass', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-submit" id="btn-register">إنشاء حسابك</button>
    </form>

    <!-- Switch -->
    <div class="login-switch" id="login-switch">
      ليس لديك حساب؟ <a onclick="switchTab('register')">أنشئ حسابك الآن</a>
    </div>
    <div class="login-switch" id="register-switch" style="display:none">
      لديك حساب بالفعل؟ <a onclick="switchTab('login')">سجّل دخولك</a>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="forgot-overlay" id="forgot-overlay">
    <div class="forgot-card" style="position:relative">
      <button class="forgot-close" onclick="closeForgot()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h2>استعادة كلمة المرور</h2>
      <p>أدخلي رقم الهاتف المسجل وسنرسل لك رابط استعادة</p>
      <form id="form-forgot" autocomplete="off">
        <div class="form-group">
          <label class="form-label">رقم الهاتف</label>
          <div class="form-input-wrap">
            <input type="tel" class="form-input" id="forgot-phone" placeholder="05XXXXXXXX" required />
            <span class="form-input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </span>
          </div>
        </div>
        <div class="form-group" id="forgot-new-pass-group" style="display:none">
          <label class="form-label">كلمة المرور الجديدة</label>
          <div class="form-input-wrap">
            <input type="password" class="form-input has-toggle" id="forgot-new-pass" placeholder="6 أحرف على الأقل" />
            <span class="form-input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <button type="button" class="pass-toggle" onclick="togglePass('forgot-new-pass', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div id="forgot-error" class="form-error"></div>
        <div id="forgot-success" class="form-success"></div>
        <button type="submit" class="login-submit" id="btn-forgot">تأكيد</button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="lz-toast" id="lz-toast"></div>

  <script src="js/api.js"></script>
  <script>
    // ══════════════════════════════════════════
    // LOGIN PAGE — API-powered Auth
    // ══════════════════════════════════════════

    (async function() {
      try { if (await API.getMe()) window.location.href = 'index.html'; } catch(e) {}
    })();

    function switchTab(form) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
      document.querySelector(`.login-tab[data-form="${form}"]`).classList.add('active');
      document.getElementById(`form-${form}`).classList.add('active');
      document.getElementById('login-switch').style.display = form === 'login' ? '' : 'none';
      document.getElementById('register-switch').style.display = form === 'register' ? '' : 'none';
      hideMessages();
    }

    document.querySelectorAll('.login-tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.form));
    });

    function showError(msg) {
      const el = document.getElementById('form-error');
      el.textContent = msg; el.classList.add('show');
      document.getElementById('form-success').classList.remove('show');
    }

    function showSuccess(msg) {
      const el = document.getElementById('form-success');
      el.textContent = msg; el.classList.add('show');
      document.getElementById('form-error').classList.remove('show');
    }

    function hideMessages() {
      document.getElementById('form-error').classList.remove('show');
      document.getElementById('form-success').classList.remove('show');
    }

    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.innerHTML = input.type === 'text'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }

    function isValidEmail(str) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str); }
    function isValidPhone(str) { return /^(059|056)\d{7}$/.test(str); }

    // LOGIN
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault(); hideMessages();
      const id = document.getElementById('login-id').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const remember = document.getElementById('remember-me').checked;
      if (!id || !pass) { showError('أدخلي رقم الجوال أو البريد وكلمة المرور'); return; }
      if (id.includes('@') && !isValidEmail(id)) { showError('صيغة البريد الإلكتروني غير صحيحة'); return; }
      try {
        await API.login(id, pass);
        if (remember) localStorage.setItem('bz_remember', id);
        else localStorage.removeItem('bz_remember');
        showSuccess('جاري التوجيه...');
        setTimeout(() => { window.location.href = 'index.html'; }, 600);
      } catch(e) { showError(e.message || 'كلمة المرور أو الحساب غير صحيح'); }
    });

    // REGISTER
    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault(); hideMessages();
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-pass').value.trim();
      if (!name || !phone || !pass) { showError('أدخلي الاسم ورقم الهاتف وكلمة المرور'); return; }
      if (name.length < 2) { showError('الاسم يجب أن يكون حرفين على الأقل'); return; }
      if (pass.length < 6) { showError('كلمة المرور 6 أحرف على الأقل'); return; }
      if (!/^(059|056)\d{7}$/.test(phone)) { showError('رقم الجوال 059 أو 056 - 10 أرقام'); return; }
      if (email && !isValidEmail(email)) { showError('صيغة البريد غير صحيحة'); return; }
      try {
        await API.register(name, phone, email || '', pass);
        showSuccess('تم إنشاء حسابك بنجاح، أهلاً ' + name + '!');
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } catch(e) { showError(e.message || 'حدث خطأ'); }
    });

    // FORGOT PASSWORD
    function openForgot() {
      document.getElementById('forgot-overlay').classList.add('open');
      document.getElementById('forgot-new-pass-group').style.display = 'none';
      document.getElementById('forgot-phone').value = '';
      document.getElementById('forgot-new-pass').value = '';
      ['forgot-error','forgot-success'].forEach(id => document.getElementById(id).classList.remove('show'));
      document.getElementById('btn-forgot').textContent = 'تأكيد';
      document.getElementById('btn-forgot').disabled = false;
    }
    function closeForgot() { document.getElementById('forgot-overlay').classList.remove('open'); }

    document.getElementById('form-forgot').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('forgot-phone').value.trim();
      const newPassGroup = document.getElementById('forgot-new-pass-group');
      const newPass = document.getElementById('forgot-new-pass').value.trim();
      const errorEl = document.getElementById('forgot-error');
      const successEl = document.getElementById('forgot-success');
      const btn = document.getElementById('btn-forgot');
      errorEl.classList.remove('show'); successEl.classList.remove('show');
      if (!phone) { errorEl.textContent = 'أدخلي رقم الهاتف'; errorEl.classList.add('show'); return; }
      if (newPassGroup.style.display === 'none') {
        newPassGroup.style.display = '';
        btn.textContent = 'حفظ كلمة المرور الجديدة';
        successEl.textContent = 'أدخلي كلمة المرور الجديدة';
        successEl.classList.add('show');
        document.getElementById('forgot-new-pass').focus();
        return;
      }
      if (!newPass || newPass.length < 6) { errorEl.textContent = 'كلمة المرور 6 أحرف على الأقل'; errorEl.classList.add('show'); return; }
      try {
        await API._fetch('POST', '/auth/forgot-password', { phone, password: newPass });
        successEl.textContent = 'تم تحديث كلمة المرور بنجاح!';
        successEl.classList.add('show');
        btn.textContent = 'تم'; btn.disabled = true;
        setTimeout(() => { closeForgot(); btn.disabled = false; btn.textContent = 'تأكيد'; newPassGroup.style.display = 'none'; }, 1500);
      } catch(e) { errorEl.textContent = e.message; errorEl.classList.add('show'); }
    });

    // Remember Me
    (function() {
      const r = localStorage.getItem('bz_remember');
      if (r) { document.getElementById('login-id').value = r; document.getElementById('remember-me').checked = true; }
    })();

    // GSAP
    window.addEventListener('load', () => {
      if (typeof gsap === 'undefined') return;
      gsap.from('.login-logo', { y: -20, opacity: 0, duration: 0.6, delay: 0.2 });
      gsap.from('.login-tabs', { y: 10, opacity: 0, duration: 0.5, delay: 0.4 });
      gsap.from('.form-group', { y: 15, opacity: 0, duration: 0.4, stagger: 0.08, delay: 0.5 });
      gsap.from('.form-options', { y: 10, opacity: 0, duration: 0.4, delay: 0.85 });
      gsap.from('.login-submit', { y: 10, opacity: 0, duration: 0.4, delay: 0.9 });
    });
  </script>

</body>
</html>
